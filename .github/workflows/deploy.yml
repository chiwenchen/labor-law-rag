name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.9.8
  GHCR_BACKEND: ghcr.io/${{ github.repository }}-backend
  GHCR_FRONTEND: ghcr.io/${{ github.repository }}-frontend

permissions:
  contents: read
  id-token: write   # OIDC for AWS
  packages: write   # GHCR push

jobs:
  # -----------------------------------------------------------------
  # 1. Terraform apply (only if infra/** changed or manual trigger)
  # -----------------------------------------------------------------
  terraform:
    runs-on: ubuntu-latest
    outputs:
      app_bucket:  ${{ steps.out.outputs.app_bucket }}
      instance_id: ${{ steps.out.outputs.instance_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect infra changes
        id: changes
        run: |
          # Always apply on manual trigger or when `before` is the null SHA
          # (initial push, force-push, or branch recreated) — treat as "infra changed".
          before="${{ github.event.before }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
             || "$before" == "0000000000000000000000000000000000000000" \
             || -z "$before" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$before" 2>/dev/null \
               && git diff --name-only "$before..${{ github.sha }}" | grep -q '^infra/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init \
            -backend-config="bucket=vera-hr-tfstate-${{ vars.AWS_ACCOUNT_ID }}" \
            -backend-config="key=vera-hr/prod/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=vera-hr-tfstate-lock" \
            -backend-config="encrypt=true"

      - name: Terraform apply
        if: steps.changes.outputs.changed == 'true'
        working-directory: infra/terraform
        env:
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_resend_api_key:    ${{ secrets.RESEND_API_KEY }}
          TF_VAR_postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
        run: terraform apply -auto-approve

      - name: Output for downstream jobs
        id: out
        working-directory: infra/terraform
        run: |
          echo "app_bucket=$(terraform output -raw app_bucket)" >> $GITHUB_OUTPUT
          echo "instance_id=$(terraform output -raw instance_id)" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------
  # 2. Build + push Docker images to GHCR
  # -----------------------------------------------------------------
  build:
    # Native ARM64 runner — EC2 is t4g.medium (Graviton/ARM64). Using
    # ubuntu-24.04-arm avoids QEMU emulation which was 10x slower on heavy
    # Python packages (torch, sentence-transformers).
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          target: prod
          push: true
          tags: |
            ${{ env.GHCR_BACKEND }}:latest
            ${{ env.GHCR_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          target: prod
          push: true
          tags: |
            ${{ env.GHCR_FRONTEND }}:latest
            ${{ env.GHCR_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # -----------------------------------------------------------------
  # 3. Sync deploy configs to S3 + trigger rollout on EC2 via SSM
  # -----------------------------------------------------------------
  rollout:
    runs-on: ubuntu-latest
    needs: [terraform, build]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync deploy configs to S3
        run: |
          aws s3 sync ./deploy/ "s3://${{ needs.terraform.outputs.app_bucket }}/config/" \
            --delete \
            --exclude ".env" \
            --exclude "*.local"
          # Also sync backend migrations so the db container can init on fresh volumes
          aws s3 sync ./backend/app/db/migrations/ \
            "s3://${{ needs.terraform.outputs.app_bucket }}/config/migrations/" \
            --delete

      - name: Send deploy command via SSM
        id: ssm
        run: |
          # user_data only syncs S3->/opt/vera-hr at boot time (when S3 was empty).
          # On every deploy we sync first so deploy.sh itself is present, then exec it.
          cmd_id=$(aws ssm send-command \
            --instance-ids "${{ needs.terraform.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.sha }}" \
            --parameters "commands=[
              'sudo -u ec2-user aws s3 sync s3://${{ needs.terraform.outputs.app_bucket }}/config/ /opt/vera-hr/ --region ${{ env.AWS_REGION }} --exclude .env',
              'chmod +x /opt/vera-hr/*.sh',
              'sudo -u ec2-user S3_BUCKET=${{ needs.terraform.outputs.app_bucket }} AWS_REGION=${{ env.AWS_REGION }} bash /opt/vera-hr/deploy.sh'
            ]" \
            --cloud-watch-output-config "CloudWatchOutputEnabled=true" \
            --query 'Command.CommandId' \
            --output text)
          echo "cmd_id=$cmd_id" >> $GITHUB_OUTPUT

      - name: Wait for deploy to finish
        run: |
          cmd_id="${{ steps.ssm.outputs.cmd_id }}"
          iid="${{ needs.terraform.outputs.instance_id }}"

          # Poll until the invocation reaches a terminal state.
          # First deploy pulls ~6GB of backend images (torch + sentence-transformers),
          # which on EC2 t4g.medium can take 15-25 min. Cap at 40 min.
          for _ in $(seq 1 240); do
            status=$(aws ssm get-command-invocation \
              --command-id "$cmd_id" --instance-id "$iid" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$status" in
              Success|Cancelled|TimedOut|Failed) break ;;
            esac
            sleep 10
          done

          echo "::group::stdout"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$iid" \
            --query 'StandardOutputContent' --output text
          echo "::endgroup::"
          echo "::group::stderr"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$iid" \
            --query 'StandardErrorContent' --output text
          echo "::endgroup::"

          if [[ "$status" != "Success" ]]; then
            echo "Deploy failed: $status"
            exit 1
          fi
